{% extends 'base.html' %}

{% block titulo %} Avaliações do {{ restaurante.nome }} - Ifood2 {% endblock %}

{% block conteudo %}
    <h2>Avaliar {{ restaurante.nome }}</h2>
    <form action="POST">
        <label for="cliente">Seu Nome: </label>
        <input type="text" id="cliente" required>

        <label for="nota">Nota (0 a 5)</label>
        <input type="number" id="nota" min="0" max="5" step="0.1" required>

        <button type="submit">Enviar a avalição</button>
    </form>

    <p><a href="{{ url_for('listar_avaliacoes', restaurante_id=restaurante.id) }}">Ver avaliações deste restaurante</a></p>
{% endblock %}
